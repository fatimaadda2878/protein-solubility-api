name: CI/CD — Protein Solubility P7

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────
  # JOB 1 : Tests
  # ────────────────────────────────────────────────
  tests:
    name: Tests pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Dépendances de test supplémentaires
          pip install pytest pytest-cov httpx

      - name: Créer les artifacts de test (CI)
        # Génère DummyClassifier dans tests/artifacts/ pour les tests
        # Ne requiert PAS le vrai modèle de production
        run: |
          python tests/create_test_artifacts.py

      - name: Lancer les tests
        run: |
          # rootdir=. assure que Python voit le package app/ et non app.py
          pytest tests/ \
            --rootdir=. \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            -v \
            --tb=short
        env:
          # Pointe vers les artifacts de test, pas le modèle de production
          MODEL_PATH: tests/artifacts/model_dummy.joblib
          ONNX_PATH: tests/artifacts/model_dummy.onnx
          ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ────────────────────────────────────────────────
  # JOB 2 : Build Docker
  # ────────────────────────────────────────────────
  build-docker:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (sans push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: p7-protein-solubility:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────
  # JOB 3 : Deploy HuggingFace Spaces
  # ────────────────────────────────────────────────
  deploy-hf:
    name: Deploy HuggingFace Spaces
    runs-on: ubuntu-latest
    needs: [tests, build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push vers HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"

          # Configurer le remote HF
          git remote add hf "https://user:${HF_TOKEN}@huggingface.co/spaces/${{ secrets.HF_SPACE_ID }}" || true
          git push hf main --force
