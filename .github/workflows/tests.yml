name: Tests du demonstrateur V7

on:
  push:
    branches: [main, 'chore/**']
  pull_request:

jobs:
  tests-sans-gpu:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Dependances du moteur de recommandations
        run: python -m pip install -r requirements-dev.txt
      - name: Syntaxe Python
        run: |
          python -m compileall -q app.py solubility tests
      - name: Tests hors GPU et hors reseau
        run: |
          python tests/test_advice.py
          python tests/test_identification.py
          python tests/test_workflow.py
          python tests/test_personalisation.py
          python tests/test_length_policy.py
