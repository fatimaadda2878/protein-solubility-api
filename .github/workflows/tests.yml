name: Tests du demonstrateur V7

on:
  push:
    branches: [main, 'chore/**']
  pull_request:

jobs:
  tests-sans-gpu:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Dependances du moteur de recommandations
        run: python -m pip install -r requirements-dev.txt
      - name: Syntaxe Python
        run: |
          python -m compileall -q app.py workflow_v5.py length_policy_v7.py expert_rules_v6.py protein_advice.py protein_identifier.py finaliser_finetune_v3_securise.py tests/v7
      - name: Tests hors GPU et hors reseau
        run: |
          python tests/v7/test_conseils_v3.py
          python tests/v7/test_identification_v4.py
          python tests/v7/test_workflow_v5.py
          python tests/v7/test_personnalisation_v6.py
          python tests/v7/test_longueur_v7.py
